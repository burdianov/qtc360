services:
  postgres:
    image: postgres:16-alpine
    container_name: qtc360-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: qtc360
      POSTGRES_USER: qtc360
      POSTGRES_PASSWORD: qtc360_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qtc360"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: qtc360-pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@qtc360.local
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

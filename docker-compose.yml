services:
  postgres:
    image: postgres:16-alpine
    container_name: qtc360-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: qtc360
      POSTGRES_USER: qtc360
      POSTGRES_PASSWORD: qtc360_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qtc360"]
      interval: 5s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: qtc360-gotenberg
    ports:
      - "3100:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:

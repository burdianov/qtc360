name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-key-minimum-32-characters-long-for-validation
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: qtc360_test
      POSTGRES_USER: qtc360
      POSTGRES_PASSWORD: qtc360_test
      ENVIRONMENT: development
      # The e2e suite assembles the S1/S2 submission bundle by converting
      # the active DOCX template to PDF. The backend prefers Gotenberg and
      # falls back to a local soffice — neither exists on the bare runner
      # image, so we bring Gotenberg up as a service on its default port
      # (3100). config.py's default GOTENBERG_URL=http://localhost:3100
      # then lines up automatically.
      GOTENBERG_URL: http://localhost:3100
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qtc360_test
          POSTGRES_USER: qtc360
          POSTGRES_PASSWORD: qtc360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      gotenberg:
        # 7.x is the line the production compose uses. Chromium + LibreOffice
        # modules handle the .docx -> .pdf conversion the S1 assembly calls.
        image: gotenberg/gotenberg:7
        ports:
          - 3100:3000

    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          # pyproject.toml requires Python 3.12; pin explicitly so a future
          # runner image change doesn't surprise us.
          python-version: "3.12"

      - name: Install dependencies (with dev extras for pytest/httpx)
        working-directory: backend
        run: uv sync --all-extras --group dev

      - name: Compile-check
        working-directory: backend
        # compileall parses the whole `app/` tree, catching syntax errors
        # that the test step would otherwise mask behind import-time deps.
        run: uv run python -m compileall app -q

      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head

      # The `e2e_documents` suite spins up its own per-session database and a
      # uvicorn instance, so it doesn't need any pre-existing fixture data.
      # It is the only suite that exercises the HTTP layer end-to-end.
      - name: Run e2e tests
        working-directory: backend
        # No `|| echo "No tests yet"` — a missing test file is a real failure
        # and should turn the build red rather than silently passing.
        run: uv run pytest tests/e2e/e2e_documents -v --tb=short --durations=10

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        # Cap warnings explicitly so a regression in unused-variable hygiene
        # fails the build rather than accumulating forever.
        working-directory: frontend
        run: npm run lint -- --max-warnings 50

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: npm run build

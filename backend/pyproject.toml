[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "email-validator>=2.2.0",
    "fastapi>=0.136.3",
    "passlib[bcrypt]>=1.7.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.29",
    "sqlalchemy[asyncio]>=2.0.50",
    "uvicorn[standard]>=0.48.0",
    "docxtpl>=0.18.0",
    "pillow>=12.2.0",
    "pypdf>=6.12.2",
    "pymupdf>=1.24.0",
    "pytesseract>=0.3.10",
    "dateparser>=1.2.0",
    "reportlab>=4.5.1",
    "openpyxl>=3.1.5",
    "pytest-asyncio>=1.4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
# Discovery: only look inside tests/. Use `uv run pytest tests/e2e` etc.
# to scope further. CI runs `pytest -v --tb=short` from backend/ which
# picks up everything discoverable below.
testpaths = ["tests"]
# pytest-asyncio 1.x defaults to "strict" — async tests must be marked
# with @pytest.mark.asyncio. Both existing e2e files do this.
asyncio_mode = "strict"
# Fail fast on collection errors so a typo in a fixture doesn't get
# silently masked.
strict = true
# Short traceback in CI keeps logs readable; show the slowest 10 tests
# at the end (useful for catching accidental full-DB-roundtrip tests
# inside unit suites).
addopts = ["-ra", "--durations=10", "--tb=short"]
